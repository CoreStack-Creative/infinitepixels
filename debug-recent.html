<!DOCTYPE html>
<html>
<head>
    <title>Debug Recent Games</title>
</head>
<body>
    <h1>Debug Recent Games System</h1>
    
    <h2>Current localStorage Data:</h2>
    <div id="currentData">Loading...</div>
    
    <h2>Actions:</h2>
    <button onclick="addTestData()">Add Test Data</button>
    <button onclick="clearData()">Clear Data</button>
    <button onclick="testRecent()">Test Recent Page Loading</button>
    <button onclick="viewGamesJson()">Test games.json Loading</button>
    
    <h2>Results:</h2>
    <div id="results"></div>

    <script>
        // Check current data
        function showCurrentData() {
            const data = localStorage.getItem('infinitePixels_recentlyPlayed');
            document.getElementById('currentData').innerHTML = data ? 
                '<pre>' + JSON.stringify(JSON.parse(data), null, 2) + '</pre>' : 
                'No data found';
        }
        
        function addTestData() {
            const testRecentGames = [
                {
                    slug: "1v1lol",
                    lastPlayed: Date.now() - 60000,
                    name: "1v1 Lol"
                },
                {
                    slug: "basketrandom", 
                    lastPlayed: Date.now() - 3600000,
                    name: "Basket Random"
                }
            ];
            
            localStorage.setItem('infinitePixels_recentlyPlayed', JSON.stringify(testRecentGames));
            showCurrentData();
            document.getElementById('results').innerHTML = '<p style="color: green;">Test data added!</p>';
        }
        
        function clearData() {
            localStorage.removeItem('infinitePixels_recentlyPlayed');
            showCurrentData();
            document.getElementById('results').innerHTML = '<p style="color: orange;">Data cleared!</p>';
        }
        
        async function testRecent() {
            try {
                // Test the recent games class
                const manager = new RecentGamesPageManager();
                document.getElementById('results').innerHTML = '<p style="color: blue;">Recent games manager created - check console for details</p>';
            } catch (error) {
                document.getElementById('results').innerHTML = '<p style="color: red;">Error creating manager: ' + error.message + '</p>';
            }
        }
        
        async function viewGamesJson() {
            try {
                const response = await fetch('games.json');
                const games = await response.json();
                document.getElementById('results').innerHTML = '<p style="color: green;">Games.json loaded successfully: ' + games.length + ' games found</p>';
                console.log('First few games:', games.slice(0, 3));
            } catch (error) {
                document.getElementById('results').innerHTML = '<p style="color: red;">Error loading games.json: ' + error.message + '</p>';
            }
        }
        
        // Initialize
        showCurrentData();
    </script>
    
    <!-- Load the recent page script for testing -->
    <script src="account-system.js"></script>
    <script src="recent-page.js"></script>
</body>
</html>
