<!DOCTYPE html>
<html>
<head>
    <title>Account System Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .form-group { margin: 10px 0; }
        input, button { padding: 8px; margin: 5px; }
        .error { color: red; }
        .success { color: green; }
        .result { margin: 20px 0; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Account System Test</h1>
    
    <div id="message"></div>
    
    <div>
        <h3>Signup</h3>
        <div class="form-group">
            <input type="text" id="signupUsername" placeholder="Username" value="testuser2024">
        </div>
        <div class="form-group">
            <input type="email" id="signupEmail" placeholder="Email" value="test2024@example.com">
        </div>
        <div class="form-group">
            <input type="password" id="signupPassword" placeholder="Password" value="password123">
        </div>
        <button onclick="testSignup()">Sign Up</button>
    </div>
    
    <div>
        <h3>Login</h3>
        <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email" value="test2024@example.com">
        </div>
        <div class="form-group">
            <input type="password" id="loginPassword" placeholder="Password" value="password123">
        </div>
        <button onclick="testLogin()">Login</button>
    </div>
    
    <div id="result" class="result"></div>
    
    <script>
        const baseURL = 'http://localhost:3000';
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${msg}</div>`;
        }
        
        function showResult(data) {
            document.getElementById('result').innerHTML = 
                '<h4>Response:</h4><pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
        
        async function testSignup() {
            try {
                const response = await fetch(`${baseURL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('signupUsername').value,
                        email: document.getElementById('signupEmail').value,
                        password: document.getElementById('signupPassword').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Signup successful!', 'success');
                    showResult(data);
                } else {
                    showMessage(`Signup failed: ${data.error}`, 'error');
                    showResult(data);
                }
            } catch (error) {
                showMessage(`Network error: ${error.message}`, 'error');
                console.error('Signup error:', error);
            }
        }
        
        async function testLogin() {
            try {
                const response = await fetch(`${baseURL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: document.getElementById('loginEmail').value,
                        password: document.getElementById('loginPassword').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Login successful!', 'success');
                    showResult(data);
                } else {
                    showMessage(`Login failed: ${data.error}`, 'error');
                    showResult(data);
                }
            } catch (error) {
                showMessage(`Network error: ${error.message}`, 'error');
                console.error('Login error:', error);
            }
        }
    </script>
</body>
</html>
