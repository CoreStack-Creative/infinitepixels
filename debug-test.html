<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
</head>
<body>
    <h1>Debug Test</h1>
    <div id="status"></div>
    
    <script src="account-system.js"></script>
    <script src="recommended.js"></script>
    <script src="recommended-page.js"></script>
    
    <script>
        function checkSystems() {
            const status = document.getElementById('status');
            let html = '<h2>System Status:</h2>';
            
            html += `<p>accountSystem exists: ${typeof accountSystem !== 'undefined'}</p>`;
            html += `<p>recommendationsEngine exists: ${typeof recommendationsEngine !== 'undefined'}</p>`;
            html += `<p>aiRecommendationsPage exists: ${typeof aiRecommendationsPage !== 'undefined'}</p>`;
            
            if (typeof accountSystem !== 'undefined') {
                html += `<p>accountSystem.isLoggedIn: ${typeof accountSystem.isLoggedIn}</p>`;
                try {
                    html += `<p>User logged in: ${accountSystem.isLoggedIn()}</p>`;
                } catch (e) {
                    html += `<p>Error checking login: ${e.message}</p>`;
                }
            }
            
            if (typeof recommendationsEngine !== 'undefined') {
                html += `<p>recommendationsEngine.isInitialized: ${recommendationsEngine.isInitialized}</p>`;
                html += `<p>recommendations count: ${recommendationsEngine.recommendations ? recommendationsEngine.recommendations.length : 'N/A'}</p>`;
            }
            
            status.innerHTML = html;
        }
        
        // Check immediately
        checkSystems();
        
        // Check after DOM loaded
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(checkSystems, 1000);
        });
        
        // Check after a longer delay
        setTimeout(checkSystems, 3000);
    </script>
</body>
</html>
