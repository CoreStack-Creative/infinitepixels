<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rating Final Test</title>
    <style>
        body {
            background: #2c2c2c;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .test-section {
            background: #1a1a1a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 2px solid #444;
        }
        
        .stars-interactive {
            display: flex;
            gap: 5px;
            margin: 20px 0;
        }
        
        .star-display-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            position: relative;
            padding: 8px;
            transition: transform 0.2s ease;
        }
        
        .star-display-btn:hover {
            transform: scale(1.1);
        }
        
        .star-display-btn i {
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .star-display-btn.filled i {
            color: #ffd700;
        }
        
        .star-display-btn.selected i {
            color: #ffd700;
        }
        
        .star-underline {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            height: 3px;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0;
            transition: width 0.3s ease;
            border-radius: 2px;
        }
        
        .star-display-btn.animate {
            animation: starPulse 0.6s ease;
        }
        
        @keyframes starPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        .rating-info {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }
        
        .rating-number {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        
        .status-indicator {
            padding: 10px 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        
        .success { background: #4CAF50; }
        .error { background: #f44336; }
        .info { background: #2196F3; }
        .warning { background: #ff9800; }
        
        .test-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        .test-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease;
        }
        
        .test-btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-primary { background: #4CAF50; color: white; }
        .btn-secondary { background: #2196F3; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-warning { background: #ff9800; color: white; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="test-container">
        <h1>🌟 Star Rating System - Final Test</h1>
        
        <div class="test-section">
            <h2>Game: Cookie Clicker</h2>
            
            <div class="rating-info">
                <div>
                    <strong>Average Rating:</strong> 
                    <span class="rating-number" id="averageRating">0.0</span>
                </div>
                <div>
                    <strong>Total Votes:</strong> 
                    <span id="ratingCount">(0 votes)</span>
                </div>
                <div>
                    <strong>Your Rating:</strong> 
                    <span id="userRating">Not rated</span>
                </div>
            </div>
            
            <div id="statusIndicator" class="status-indicator info">
                Ready to test star rating system...
            </div>
            
            <div class="stars-interactive" id="starsInteractive">
                <button class="star-display-btn" data-rating="1">
                    <i class="fas fa-star"></i>
                    <div class="star-underline"></div>
                </button>
                <button class="star-display-btn" data-rating="2">
                    <i class="fas fa-star"></i>
                    <div class="star-underline"></div>
                </button>
                <button class="star-display-btn" data-rating="3">
                    <i class="fas fa-star"></i>
                    <div class="star-underline"></div>
                </button>
                <button class="star-display-btn" data-rating="4">
                    <i class="fas fa-star"></i>
                    <div class="star-underline"></div>
                </button>
                <button class="star-display-btn" data-rating="5">
                    <i class="fas fa-star"></i>
                    <div class="star-underline"></div>
                </button>
            </div>
            
            <div class="test-controls">
                <button class="test-btn btn-primary" onclick="initializeStarRating()">
                    <i class="fas fa-play"></i> Initialize Star Rating
                </button>
                <button class="test-btn btn-secondary" onclick="showTestRating(4)">
                    <i class="fas fa-eye"></i> Preview 4-Star Rating
                </button>
                <button class="test-btn btn-warning" onclick="resetRating()">
                    <i class="fas fa-refresh"></i> Reset Rating
                </button>
                <button class="test-btn btn-danger" onclick="clearAllData()">
                    <i class="fas fa-trash"></i> Clear All Data
                </button>
            </div>
        </div>
        
        <div class="test-section">
            <h3>Test Results</h3>
            <div id="testResults">
                <p>No tests run yet. Click "Initialize Star Rating" to begin.</p>
            </div>
        </div>
    </div>

    <script>
        // Test game data
        const testGame = {
            slug: 'cookieclicker',
            name: 'Cookie Clicker'
        };
        
        // Mock games database
        const gamesDatabase = [testGame];
        
        let testResults = [];
        
        function updateStatus(message, type = 'info') {
            const indicator = document.getElementById('statusIndicator');
            indicator.textContent = message;
            indicator.className = `status-indicator ${type}`;
        }
        
        function addTestResult(result, success = true) {
            testResults.push({
                result,
                success,
                timestamp: new Date().toLocaleTimeString()
            });
            
            const resultsDiv = document.getElementById('testResults');
            const resultItem = document.createElement('div');
            resultItem.style.cssText = `
                padding: 8px 12px;
                margin: 5px 0;
                border-radius: 4px;
                background: ${success ? '#d4edda' : '#f8d7da'};
                color: ${success ? '#155724' : '#721c24'};
                border: 1px solid ${success ? '#c3e6cb' : '#f5c6cb'};
            `;
            resultItem.innerHTML = `
                <span style="font-weight: bold;">[${testResults[testResults.length - 1].timestamp}]</span>
                ${success ? '✅' : '❌'} ${result}
            `;
            resultsDiv.appendChild(resultItem);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }
        
        function updateRatingDisplay() {
            const gameRatings = JSON.parse(localStorage.getItem('gameRatings') || '{}');
            const userRating = localStorage.getItem('cookieclicker_userRating');
            const rating = gameRatings['cookieclicker'];
            
            document.getElementById('averageRating').textContent = rating ? rating.average.toFixed(1) : '0.0';
            document.getElementById('ratingCount').textContent = rating ? `(${rating.totalVotes} vote${rating.totalVotes !== 1 ? 's' : ''})` : '(0 votes)';
            document.getElementById('userRating').textContent = userRating ? `${userRating} star${userRating !== '1' ? 's' : ''}` : 'Not rated';
        }
        
        function resetRating() {
            localStorage.removeItem('cookieclicker_userRating');
            updateStatus('Rating reset. You can now rate again.', 'warning');
            updateRatingDisplay();
            addTestResult('Rating data reset successfully');
            
            // Re-enable stars
            const starsInteractive = document.getElementById('starsInteractive');
            if (starsInteractive) {
                starsInteractive.classList.remove('rated');
                document.querySelectorAll('.star-display-btn').forEach(btn => {
                    btn.disabled = false;
                    btn.style.pointerEvents = 'auto';
                    btn.style.cursor = 'pointer';
                    btn.classList.remove('selected');
                    btn.querySelector('i').style.color = 'rgba(255, 255, 255, 0.3)';
                    btn.querySelector('.star-underline').style.width = '0';
                });
            }
        }
        
        function clearAllData() {
            localStorage.removeItem('cookieclicker_userRating');
            localStorage.removeItem('gameRatings');
            updateStatus('All rating data cleared.', 'warning');
            updateRatingDisplay();
            addTestResult('All rating data cleared successfully');
            
            // Reset visual state
            resetRating();
        }
        
        function showTestRating(rating) {
            const starButtons = document.querySelectorAll('.star-display-btn');
            starButtons.forEach((button, index) => {
                const buttonRating = parseInt(button.dataset.rating);
                const icon = button.querySelector('i');
                const underline = button.querySelector('.star-underline');
                
                if (buttonRating <= rating) {
                    icon.style.color = '#ffd700';
                    underline.style.width = '100%';
                } else {
                    icon.style.color = 'rgba(255, 255, 255, 0.3)';
                    underline.style.width = '0';
                }
            });
            
            updateStatus(`Previewing ${rating}-star rating`, 'info');
            addTestResult(`Preview of ${rating}-star rating displayed`);
        }
        
        function initializeStarRating() {
            updateStatus('Initializing star rating system...', 'info');
            addTestResult('Starting star rating initialization');
            
            // Create enhanced GameLoader implementation
            class TestGameLoader {
                constructor() {
                    this.setupStarRating(testGame);
                }
                
                getGameRatings() {
                    const saved = localStorage.getItem('gameRatings');
                    return saved ? JSON.parse(saved) : {};
                }

                saveGameRatings(ratings) {
                    localStorage.setItem('gameRatings', JSON.stringify(ratings));
                }

                updateRatingDisplay(gameSlug) {
                    updateRatingDisplay();
                }
                
                async loadGlobalRating(gameSlug) {
                    // Mock server call
                    console.log('Loading global rating for:', gameSlug);
                    addTestResult('Global rating loaded from server');
                }
                
                highlightStarsUpTo(rating) {
                    const starButtons = document.querySelectorAll('.star-display-btn');
                    starButtons.forEach((button) => {
                        const buttonRating = parseInt(button.dataset.rating);
                        const underline = button.querySelector('.star-underline');
                        const icon = button.querySelector('i');
                        
                        button.classList.remove('filled');
                        
                        if (buttonRating <= rating) {
                            underline.style.width = '80%';
                            icon.style.color = 'rgba(255, 255, 255, 0.8)';
                            icon.style.transform = 'scale(1.05)';
                        } else {
                            underline.style.width = '0';
                            icon.style.color = 'rgba(255, 255, 255, 0.3)';
                            icon.style.transform = 'scale(1)';
                        }
                    });
                }
                
                showUserRating(userRating) {
                    const starButtons = document.querySelectorAll('.star-display-btn');
                    starButtons.forEach((button) => {
                        const buttonRating = parseInt(button.dataset.rating);
                        const underline = button.querySelector('.star-underline');
                        const icon = button.querySelector('i');
                        
                        button.classList.remove('filled');
                        
                        if (buttonRating <= userRating) {
                            button.classList.add('selected');
                            underline.style.width = '100%';
                            underline.style.height = '3px';
                            underline.style.boxShadow = '0 0 4px rgba(255, 215, 0, 0.5)';
                            icon.style.color = '#ffd700';
                        } else {
                            button.classList.remove('selected');
                            underline.style.width = '0';
                            underline.style.height = '2px';
                            underline.style.boxShadow = 'none';
                            icon.style.color = 'rgba(255, 255, 255, 0.3)';
                        }
                    });
                }
                
                async submitRating(gameSlug, rating) {
                    console.log('Submitting rating:', rating, 'for game:', gameSlug);
                    addTestResult(`Rating ${rating} stars submitted for ${gameSlug}`);
                    
                    // Save user rating
                    localStorage.setItem(`${gameSlug}_userRating`, rating.toString());
                    
                    // Update game ratings
                    const gameRatings = this.getGameRatings();
                    if (!gameRatings[gameSlug]) {
                        gameRatings[gameSlug] = { totalStars: 0, totalVotes: 0, average: 0 };
                    }

                    gameRatings[gameSlug].totalStars += rating;
                    gameRatings[gameSlug].totalVotes += 1;
                    gameRatings[gameSlug].average = gameRatings[gameSlug].totalStars / gameRatings[gameSlug].totalVotes;

                    this.saveGameRatings(gameRatings);
                    this.updateRatingDisplay(gameSlug);
                    
                    updateStatus(`✅ Successfully rated ${rating} stars!`, 'success');
                    addTestResult(`Rating successfully saved: ${rating} stars`, true);
                }
                
                setupStarRating(game) {
                    const initializeStars = () => {
                        const starsInteractive = document.getElementById('starsInteractive');
                        const starButtons = document.querySelectorAll('.star-display-btn');

                        console.log('Stars setup - Interactive container:', !!starsInteractive);
                        console.log('Stars setup - Star buttons found:', starButtons.length);
                        
                        addTestResult(`Found ${starButtons.length} star buttons`);

                        if (!starsInteractive || !starButtons.length) {
                            addTestResult('Star rating elements not found!', false);
                            updateStatus('❌ Star rating elements not found!', 'error');
                            return false;
                        }

                        // Initialize rating data
                        const gameRatings = this.getGameRatings();
                        if (!gameRatings[game.slug]) {
                            gameRatings[game.slug] = {
                                totalStars: 0,
                                totalVotes: 0,
                                average: 0
                            };
                            this.saveGameRatings(gameRatings);
                            addTestResult('Initialized empty rating data');
                        }

                        // Check if user has already rated
                        const userRatingKey = `${game.slug}_userRating`;
                        const hasRated = localStorage.getItem(userRatingKey);

                        this.updateRatingDisplay(game.slug);
                        this.loadGlobalRating(game.slug);

                        if (hasRated) {
                            console.log('User has already rated:', hasRated);
                            addTestResult(`User has already rated: ${hasRated} stars`);
                            
                            const userRating = parseInt(hasRated);
                            starsInteractive.classList.add('rated');
                            this.showUserRating(userRating);
                            
                            starButtons.forEach(btn => {
                                btn.disabled = true;
                                btn.style.pointerEvents = 'none';
                                btn.style.cursor = 'default';
                            });
                            
                            updateStatus(`You've already rated this game: ${hasRated} stars`, 'info');
                        } else {
                            console.log('Setting up interactive rating...');
                            addTestResult('Setting up interactive rating');
                            
                            starsInteractive.classList.remove('rated');
                            
                            starButtons.forEach(btn => {
                                btn.disabled = false;
                                btn.style.pointerEvents = 'auto';
                                btn.style.cursor = 'pointer';
                                
                                const newBtn = btn.cloneNode(true);
                                btn.parentNode.replaceChild(newBtn, btn);
                            });
                            
                            const freshStarButtons = document.querySelectorAll('.star-display-btn');
                            
                            freshStarButtons.forEach((button, index) => {
                                const rating = parseInt(button.dataset.rating);

                                button.addEventListener('mouseenter', (e) => {
                                    e.stopPropagation();
                                    this.highlightStarsUpTo(rating);
                                });

                                button.addEventListener('click', async (e) => {
                                    console.log('Star clicked:', rating);
                                    e.preventDefault();
                                    e.stopPropagation();
                                    
                                    if (!starsInteractive.classList.contains('rated')) {
                                        console.log('Processing rating submission...');
                                        
                                        starsInteractive.classList.add('rated');
                                        this.showUserRating(rating);
                                        
                                        freshStarButtons.forEach(btn => {
                                            btn.disabled = true;
                                            btn.style.pointerEvents = 'none';
                                            btn.style.cursor = 'default';
                                        });
                                        
                                        button.classList.add('animate');
                                        setTimeout(() => button.classList.remove('animate'), 600);
                                        
                                        await this.submitRating(game.slug, rating);
                                        console.log('Rating submission complete');
                                    }
                                });
                            });

                            starsInteractive.addEventListener('mouseleave', () => {
                                if (!starsInteractive.classList.contains('rated')) {
                                    this.loadGlobalRating(game.slug);
                                }
                            });
                            
                            updateStatus('⭐ Ready for rating! Click a star to rate.', 'success');
                            addTestResult('Star rating system ready for interaction', true);
                        }
                        return true;
                    };

                    // Try initialization with retries
                    const attemptInitialization = (attempt = 1, maxAttempts = 3) => {
                        console.log(`Star rating initialization attempt ${attempt}/${maxAttempts}`);
                        
                        if (initializeStars()) {
                            console.log('✅ Star rating initialized successfully!');
                            addTestResult('Star rating initialization completed successfully', true);
                            return;
                        }
                        
                        if (attempt < maxAttempts) {
                            const delay = attempt * 200;
                            console.log(`Retrying in ${delay}ms...`);
                            setTimeout(() => attemptInitialization(attempt + 1, maxAttempts), delay);
                        } else {
                            console.warn('❌ Failed to initialize star rating');
                            addTestResult('Star rating initialization failed after all attempts', false);
                            updateStatus('❌ Failed to initialize star rating', 'error');
                        }
                    };

                    attemptInitialization();
                }
            }
            
            // Initialize the test
            new TestGameLoader();
        }
        
        // Auto-initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            updateRatingDisplay();
            setTimeout(() => {
                addTestResult('Page loaded successfully');
                addTestResult('DOM ready for star rating initialization');
            }, 100);
        });
    </script>
</body>
</html>
