<!DOCTYPE html>
<html>
<head>
    <title>Simple Recent Test</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Simple Recent Games Test</h1>
    
    <button onclick="addData()">Add Test Data</button>
    <button onclick="testLoad()">Test Load Function</button>
    <div id="output"></div>
    
    <div class="games-grid" id="recentGamesGrid">
        <div>Loading...</div>
    </div>

    <script>
        function addData() {
            const testData = [
                {
                    slug: "1v1lol",
                    lastPlayed: Date.now() - 60000,
                    name: "1v1 Lol"
                }
            ];
            localStorage.setItem('infinitePixels_recentlyPlayed', JSON.stringify(testData));
            document.getElementById('output').innerHTML = 'Data added!';
        }
        
        async function testLoad() {
            try {
                // Load games
                console.log('Loading games...');
                const response = await fetch('games.json');
                const games = await response.json();
                console.log('Games loaded:', games.length);
                
                // Load recent
                const stored = localStorage.getItem('infinitePixels_recentlyPlayed');
                console.log('Stored data:', stored);
                const localRecent = stored ? JSON.parse(stored) : [];
                console.log('Parsed recent:', localRecent);
                
                // Convert format
                const recentGames = localRecent.map(game => ({
                    game_id: game.slug,
                    last_played: new Date(game.lastPlayed).toISOString()
                }));
                console.log('Converted recent games:', recentGames);
                
                // Find and render
                const grid = document.getElementById('recentGamesGrid');
                if (recentGames.length === 0) {
                    grid.innerHTML = '<div>No recent games found</div>';
                    return;
                }
                
                const gameCards = recentGames.map(recentGame => {
                    const gameIdentifier = recentGame.game_id;
                    console.log('Looking for game:', gameIdentifier);
                    const game = games.find(g => 
                        g.id === gameIdentifier || 
                        g.slug === gameIdentifier ||
                        g.id === parseInt(gameIdentifier)
                    );
                    
                    if (!game) {
                        console.warn('Game not found:', gameIdentifier);
                        return '<div>Game not found: ' + gameIdentifier + '</div>';
                    }
                    
                    console.log('Found game:', game.name);
                    
                    // Simple card
                    return `
                        <div class="game-card">
                            <img src="${game.image}" alt="${game.name}" style="width: 100px;">
                            <h3>${game.name}</h3>
                            <p>Slug: ${game.slug}</p>
                        </div>
                    `;
                });
                
                grid.innerHTML = gameCards.join('');
                document.getElementById('output').innerHTML = 'Test completed - check console and output above';
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('output').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
