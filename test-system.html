<!DOCTYPE html>
<html>
<head>
    <title>Recent Games Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h1>Recent Games System Test</h1>
    <div id="results"></div>
    <button onclick="runTests()">Run Tests</button>

    <script>
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Running tests...</p>';
            
            const testResults = [];
            
            try {
                // Test 1: Add a game to recent games
                testResults.push(await testAddRecentGame());
                
                // Test 2: Load games.json
                testResults.push(await testLoadGames());
                
                // Test 3: Test recent games page manager
                testResults.push(await testRecentGamesManager());
                
            } catch (error) {
                testResults.push({
                    name: 'General Error',
                    success: false,
                    message: error.message
                });
            }
            
            displayResults(testResults);
        }
        
        async function testAddRecentGame() {
            try {
                // Clear existing
                localStorage.removeItem('infinitePixels_recentlyPlayed');
                
                // Add test game
                const testGame = {
                    slug: '1v1lol',
                    lastPlayed: Date.now()
                };
                
                localStorage.setItem('infinitePixels_recentlyPlayed', JSON.stringify([testGame]));
                
                // Verify
                const stored = localStorage.getItem('infinitePixels_recentlyPlayed');
                const parsed = JSON.parse(stored);
                
                if (parsed.length === 1 && parsed[0].slug === '1v1lol') {
                    return { name: 'Add Recent Game', success: true, message: 'Successfully added and retrieved recent game' };
                } else {
                    return { name: 'Add Recent Game', success: false, message: 'Failed to store recent game properly' };
                }
            } catch (error) {
                return { name: 'Add Recent Game', success: false, message: error.message };
            }
        }
        
        async function testLoadGames() {
            try {
                const response = await fetch('games.json');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const games = await response.json();
                
                if (games && games.length > 0) {
                    const testGame = games.find(g => g.slug === '1v1lol');
                    if (testGame) {
                        return { name: 'Load Games', success: true, message: `Loaded ${games.length} games, found test game: ${testGame.name}` };
                    } else {
                        return { name: 'Load Games', success: false, message: `Loaded ${games.length} games, but could not find 1v1lol` };
                    }
                } else {
                    return { name: 'Load Games', success: false, message: 'No games loaded or empty array' };
                }
            } catch (error) {
                return { name: 'Load Games', success: false, message: error.message };
            }
        }
        
        async function testRecentGamesManager() {
            try {
                // Simulate recent games manager
                const stored = localStorage.getItem('infinitePixels_recentlyPlayed');
                const localRecent = stored ? JSON.parse(stored) : [];
                
                const recentGames = localRecent.map(game => ({
                    game_id: game.slug,
                    last_played: new Date(game.lastPlayed).toISOString()
                }));
                
                if (recentGames.length > 0 && recentGames[0].game_id === '1v1lol') {
                    return { name: 'Recent Games Manager', success: true, message: `Converted ${recentGames.length} recent games successfully` };
                } else {
                    return { name: 'Recent Games Manager', success: false, message: 'Failed to convert recent games format' };
                }
            } catch (error) {
                return { name: 'Recent Games Manager', success: false, message: error.message };
            }
        }
        
        function displayResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = results.map(result => `
                <div class="test-result ${result.success ? 'success' : 'error'}">
                    <strong>${result.name}:</strong> ${result.message}
                </div>
            `).join('');
            
            const allPassed = results.every(r => r.success);
            container.innerHTML += `
                <div class="test-result ${allPassed ? 'success' : 'info'}">
                    <strong>Overall:</strong> ${allPassed ? 'All tests passed!' : 'Some tests failed. Check individual results above.'}
                </div>
            `;
            
            if (allPassed) {
                container.innerHTML += `
                    <div class="test-result info">
                        <strong>Next step:</strong> <a href="recent.html">Test the recent games page</a>
                    </div>
                `;
            }
        }
        
        // Run tests on page load
        document.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
