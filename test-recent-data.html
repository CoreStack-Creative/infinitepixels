<!DOCTYPE html>
<html>
<head>
    <title>Test Recent Games Data</title>
</head>
<body>
    <h1>Test Recent Games Data</h1>
    <button onclick="addTestData()">Add Test Recent Games</button>
    <button onclick="clearData()">Clear Recent Games</button>
    <button onclick="viewData()">View Current Data</button>
    <button onclick="goToRecent()">Go to Recent Page</button>
    
    <div id="output"></div>

    <script>
        function addTestData() {
            const testRecentGames = [
                {
                    slug: "1v1lol",
                    lastPlayed: Date.now() - 60000, // 1 minute ago
                    name: "1v1 Lol"
                },
                {
                    slug: "cookieclicker",
                    lastPlayed: Date.now() - 3600000, // 1 hour ago
                    name: "Cookie Clicker"
                },
                {
                    slug: "happywheels",
                    lastPlayed: Date.now() - 86400000, // 1 day ago
                    name: "Happy Wheels"
                }
            ];
            
            localStorage.setItem('infinitePixels_recentlyPlayed', JSON.stringify(testRecentGames));
            document.getElementById('output').innerHTML = '<p style="color: green;">Test data added!</p>';
        }
        
        function clearData() {
            localStorage.removeItem('infinitePixels_recentlyPlayed');
            document.getElementById('output').innerHTML = '<p style="color: orange;">Data cleared!</p>';
        }
        
        function viewData() {
            const data = localStorage.getItem('infinitePixels_recentlyPlayed');
            document.getElementById('output').innerHTML = '<pre>' + (data || 'No data found') + '</pre>';
        }
        
        function goToRecent() {
            window.location.href = 'recent.html';
        }
    </script>
</body>
</html>
