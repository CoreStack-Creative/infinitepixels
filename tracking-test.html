<!DOCTYPE html>
<html>
<head>
    <title>Game Tracking Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border-color: #bee5eb; }
        button { margin: 5px; padding: 10px 15px; }
    </style>
</head>
<body>
    <h1>Game Tracking Debug</h1>
    
    <div class="test-section">
        <h3>Manual Tracking Test</h3>
        <button onclick="testTrackGame('1v1lol')">Track 1v1 LOL</button>
        <button onclick="testTrackGame('basketrandom')">Track Basket Random</button>
        <button onclick="testTrackGame('cookieclicker')">Track Cookie Clicker</button>
        <div id="tracking-results"></div>
    </div>

    <div class="test-section">
        <h3>Recent Games Status</h3>
        <button onclick="checkRecentGames()">Check Recent Games</button>
        <button onclick="clearRecentGames()">Clear Recent Games</button>
        <div id="recent-status"></div>
    </div>

    <div class="test-section">
        <h3>Navigation Test</h3>
        <button onclick="goToGame('1v1lol')">Go to 1v1 LOL</button>
        <button onclick="goToGame('basketrandom')">Go to Basket Random</button>
        <button onclick="goToRecent()">Go to Recent Page</button>
    </div>

    <!-- Include the necessary scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="account-system.js"></script>
    <script src="javascript.js"></script>

    <script>
        function testTrackGame(gameSlug) {
            console.log('Manual tracking test for:', gameSlug);
            
            if (window.trackGameVisit) {
                window.trackGameVisit(gameSlug);
                updateStatus('tracking-results', `Attempted to track: ${gameSlug}`, 'info');
            } else {
                updateStatus('tracking-results', 'trackGameVisit function not found!', 'error');
            }
        }

        function checkRecentGames() {
            const stored = localStorage.getItem('infinitePixels_recentlyPlayed');
            const results = document.getElementById('recent-status');
            
            if (stored) {
                try {
                    const games = JSON.parse(stored);
                    results.innerHTML = `
                        <div class="info">
                            <strong>Local Storage Recent Games:</strong><br>
                            ${games.map(g => `${g.slug} (${new Date(g.lastPlayed).toLocaleString()})`).join('<br>')}
                        </div>
                    `;
                } catch (e) {
                    results.innerHTML = `<div class="error">Error parsing recent games: ${e.message}</div>`;
                }
            } else {
                results.innerHTML = `<div class="info">No recent games in localStorage</div>`;
            }
        }

        function clearRecentGames() {
            localStorage.removeItem('infinitePixels_recentlyPlayed');
            updateStatus('recent-status', 'Recent games cleared', 'success');
        }

        function goToGame(gameSlug) {
            window.location.href = `game.html?game=${gameSlug}`;
        }

        function goToRecent() {
            window.location.href = 'recent.html';
        }

        function updateStatus(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="${type}">${message}</div>`;
        }

        // Auto-check recent games on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                checkRecentGames();
                
                // Check if account system is loaded
                if (window.accountSystem) {
                    updateStatus('tracking-results', 'Account system loaded ✓', 'success');
                } else {
                    updateStatus('tracking-results', 'Account system not loaded ✗', 'error');
                }
            }, 1000);
        });
    </script>
</body>
</html>
