<!DOCTYPE html>
<html>
<head>
    <title>Account System Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .loading { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 200px; }
        .console-output { background: #f8f9fa; padding: 10px; height: 300px; overflow-y: scroll; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Account System Test Page</h1>
    
    <div class="test-section">
        <h2>System Status</h2>
        <div id="system-status" class="status loading">Checking system status...</div>
    </div>
    
    <div class="test-section">
        <h2>Login Test</h2>
        <div>
            <input type="email" id="test-email" placeholder="test@example.com" value="test@example.com">
            <input type="password" id="test-password" placeholder="password" value="password123">
            <button onclick="testLogin()">Test Login</button>
            <button onclick="testLogout()">Test Logout</button>
        </div>
        <div id="login-status" class="status">Ready for login test</div>
    </div>
    
    <div class="test-section">
        <h2>Account Data Test</h2>
        <button onclick="testGetStats()">Get Account Stats</button>
        <button onclick="testGetFavorites()">Get Favorites</button>
        <button onclick="testGetRecent()">Get Recent Games</button>
        <div id="data-status" class="status">Ready for data test</div>
    </div>
    
    <div class="test-section">
        <h2>Console Output</h2>
        <div id="console-output" class="console-output"></div>
        <button onclick="clearConsole()">Clear Console</button>
    </div>
    
    <!-- Dependencies -->
    <script src="https://unpkg.com/@supabase/supabase-js@2.0.0/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="account-system.js"></script>
    
    <script>
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(type, message) {
            const div = document.createElement('div');
            div.style.color = type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black';
            div.textContent = `[${new Date().toLocaleTimeString()}] [${type.toUpperCase()}] ${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole('log', args.join(' '));
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole('error', args.join(' '));
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            addToConsole('warn', args.join(' '));
        };
        
        function updateStatus(elementId, message, type = 'loading') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${type}`;
        }
        
        function clearConsole() {
            consoleOutput.innerHTML = '';
        }
        
        function checkSystemStatus() {
            try {
                console.log('Checking account system...');
                
                if (typeof accountSystem === 'undefined') {
                    updateStatus('system-status', 'ERROR: accountSystem not loaded', 'error');
                    console.error('accountSystem is undefined');
                    return;
                }
                
                console.log('accountSystem found:', typeof accountSystem);
                console.log('accountSystem methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(accountSystem)));
                
                const isLoggedIn = accountSystem.isLoggedIn();
                const hasSupabase = typeof supabase !== 'undefined';
                const hasConfig = typeof SUPABASE_CONFIG !== 'undefined';
                
                console.log('Login status:', isLoggedIn);
                console.log('Supabase available:', hasSupabase);
                console.log('Config available:', hasConfig);
                
                if (accountSystem.user) {
                    console.log('Current user:', accountSystem.user);
                }
                
                updateStatus('system-status', 
                    `Account system loaded. Logged in: ${isLoggedIn}, Supabase: ${hasSupabase}, Config: ${hasConfig}`, 
                    'success');
                    
            } catch (error) {
                updateStatus('system-status', `ERROR: ${error.message}`, 'error');
                console.error('System check error:', error);
            }
        }
        
        async function testLogin() {
            try {
                const email = document.getElementById('test-email').value;
                const password = document.getElementById('test-password').value;
                
                if (!email || !password) {
                    updateStatus('login-status', 'Please enter email and password', 'error');
                    return;
                }
                
                updateStatus('login-status', 'Attempting login...', 'loading');
                console.log('Testing login with:', email);
                
                const result = await accountSystem.login(email, password);
                
                if (result.success) {
                    updateStatus('login-status', `Login successful! User: ${result.user.email}`, 'success');
                    console.log('Login successful:', result);
                } else {
                    updateStatus('login-status', `Login failed: ${result.error}`, 'error');
                    console.error('Login failed:', result);
                }
                
            } catch (error) {
                updateStatus('login-status', `Login error: ${error.message}`, 'error');
                console.error('Login error:', error);
            }
        }
        
        async function testLogout() {
            try {
                updateStatus('login-status', 'Logging out...', 'loading');
                console.log('Testing logout...');
                
                const result = await accountSystem.logout();
                
                if (result.success) {
                    updateStatus('login-status', 'Logout successful', 'success');
                    console.log('Logout successful');
                } else {
                    updateStatus('login-status', `Logout failed: ${result.error}`, 'error');
                    console.error('Logout failed:', result);
                }
                
            } catch (error) {
                updateStatus('login-status', `Logout error: ${error.message}`, 'error');
                console.error('Logout error:', error);
            }
        }
        
        function testGetStats() {
            try {
                console.log('Testing account stats...');
                
                if (!accountSystem.isLoggedIn()) {
                    updateStatus('data-status', 'Must be logged in to get stats', 'error');
                    return;
                }
                
                const totalTime = accountSystem.getTotalPlayTime();
                const recentGames = accountSystem.getRecentGames();
                const favorites = accountSystem.getFavorites();
                
                console.log('Total play time:', totalTime);
                console.log('Recent games count:', recentGames.length);
                console.log('Favorites count:', favorites.length);
                
                updateStatus('data-status', 
                    `Stats: ${totalTime}ms playtime, ${recentGames.length} recent, ${favorites.length} favorites`, 
                    'success');
                    
            } catch (error) {
                updateStatus('data-status', `Stats error: ${error.message}`, 'error');
                console.error('Stats error:', error);
            }
        }
        
        function testGetFavorites() {
            try {
                console.log('Testing favorites...');
                const favorites = accountSystem.getFavorites();
                console.log('Favorites:', favorites);
                updateStatus('data-status', `Found ${favorites.length} favorite games`, 'success');
            } catch (error) {
                updateStatus('data-status', `Favorites error: ${error.message}`, 'error');
                console.error('Favorites error:', error);
            }
        }
        
        function testGetRecent() {
            try {
                console.log('Testing recent games...');
                const recent = accountSystem.getRecentGames();
                console.log('Recent games:', recent);
                updateStatus('data-status', `Found ${recent.length} recent games`, 'success');
            } catch (error) {
                updateStatus('data-status', `Recent games error: ${error.message}`, 'error');
                console.error('Recent games error:', error);
            }
        }
        
        // Run initial check
        setTimeout(() => {
            console.log('Starting system check...');
            checkSystemStatus();
        }, 1000);
        
        // Check again after longer delay
        setTimeout(() => {
            console.log('Running delayed system check...');
            checkSystemStatus();
        }, 3000);
    </script>
</body>
</html>
