<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - InfinitePixels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reset-password-container">
        <h1>Reset Your Password</h1>
        <form id="resetPasswordForm">
            <div class="form-group">
                <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <a href="index.html">Back to Home</a>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (window.supabase) {
                const { error } = await window.supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) {
                    alert('Error updating password: ' + error.message);
                } else {
                    alert('Password updated successfully!');
                    window.location.href = 'index.html';
                }
            }
        });
    </script>
</body>
</html>
