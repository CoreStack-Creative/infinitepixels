<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - InfinitePixels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="reset-password-container">
        <h1>Reset Your Password</h1>
        <form id="resetPasswordForm">
            <div class="form-group">
                <input type="password" id="newPassword" placeholder="New Password" required minlength="6">
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required minlength="6">
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <a href="index.html">Back to Home</a>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // Check if user is authenticated for password reset
        window.supabase?.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
                console.log('User authenticated for password reset');
            } else if (event === 'SIGNED_OUT') {
                // If user is not authenticated, redirect to login
                alert('Session expired. Please request a new password reset link.');
                window.location.href = 'index.html';
            }
        });

        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (window.supabase) {
                const { error } = await window.supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) {
                    alert('Error updating password: ' + error.message);
                } else {
                    alert('Password updated successfully!');
                    // Sign out and redirect to login
                    await window.supabase.auth.signOut();
                    window.location.href = 'index.html';
                }
            } else {
                alert('Authentication service not available');
            }
        });
    </script>
</body>
</html>
