<!DOCTYPE html>
<html>
<head>
  <title>Sitemap Generator</title>
</head>
<body>
  <h1>Sitemap Generator</h1>
  <button onclick="generateSitemap()">Generate Sitemap</button>
  <pre id="output"></pre>

  <script>
    const baseUrl = "https://www.infinite-pixels.com";

    // Pages to exclude from the sitemap (internal tools, admin pages, etc.)
    const excludedPages = [
      "sitemap-generator.html",
      "reset-password.html"
    ];

    // Priority mapping for different page types
    const pagePriorities = {
      "index.html": "1.0",
      "games.html": "0.9",
      "category.html": "0.9",
      "newgames.html": "0.8",
      "favorites.html": "0.8",
      "recent.html": "0.8",
      "recommended.html": "0.8",
      "random.html": "0.7",
      "game-reviews.html": "0.7",
      "game-guides.html": "0.7",
      "account.html": "0.6",
      "news.html": "0.6",
      "about.html": "0.5",
      "contact.html": "0.5",
      "faq.html": "0.5",
      "settings.html": "0.4",
      "privacypolicy.html": "0.3",
      "termsandconditions.html": "0.3",
      "game.html": "0.8"
    };

    async function discoverHtmlPages() {
      try {
        // Get the list of all files in the root directory
        const response = await fetch('./');
        const html = await response.text();
        
        // Parse HTML to find .html files
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const links = doc.querySelectorAll('a[href$=".html"]');
        
        const htmlPages = [];
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && !excludedPages.includes(href)) {
            htmlPages.push(href);
          }
        });

        // Fallback: manually list known pages if directory listing doesn't work
        if (htmlPages.length === 0) {
          return [
            "index.html",
            "about.html",
            "account.html",
            "category.html",
            "contact.html", 
            "faq.html",
            "favorites.html",
            "game.html",
            "game-guides.html",
            "game-reviews.html",
            "games.html",
            "news.html",
            "newgames.html",
            "privacypolicy.html",
            "random.html",
            "recent.html",
            "recommended.html",
            "settings.html",
            "termsandconditions.html"
          ];
        }

        return htmlPages;
      } catch (error) {
        console.warn('Could not auto-discover HTML pages, using fallback list:', error);
        // Fallback list of known pages
        return [
          "index.html",
          "about.html",
          "account.html",
          "category.html",
          "contact.html",
          "faq.html",
          "favorites.html",
          "game.html",
          "game-guides.html",
          "game-reviews.html",
          "games.html",
          "news.html",
          "newgames.html",
          "privacypolicy.html",
          "random.html",
          "recent.html",
          "recommended.html",
          "settings.html",
          "termsandconditions.html"
        ];
      }
    }

    async function generateSitemap() {
      try {
        // Discover all HTML pages automatically
        const htmlPages = await discoverHtmlPages();
        
        // Fetch games.json for dynamic game pages
        const response = await fetch("games.json");
        const gamesDatabase = await response.json();

        // Create a Set to track unique URLs and avoid duplicates
        const uniqueUrls = new Set();
        const urlsArray = [];

        // Add root URL first
        if (htmlPages.includes("index.html")) {
          const rootUrlObj = {
            loc: `${baseUrl}/`,
            lastmod: new Date().toISOString(),
            priority: "1.0"
          };
          uniqueUrls.add(rootUrlObj.loc);
          urlsArray.push(rootUrlObj);
        }

        // Add all HTML pages (excluding index.html since we already added root)
        htmlPages
          .filter(page => page !== "index.html") // Skip index.html since we added root URL
          .forEach(page => {
            const url = `${baseUrl}/${page}`;
            if (!uniqueUrls.has(url)) {
              const priority = pagePriorities[page] || "0.6";
              uniqueUrls.add(url);
              urlsArray.push({
                loc: url,
                lastmod: new Date().toISOString(),
                priority: priority
              });
            }
          });

        // Add game pages
        gamesDatabase.forEach(game => {
          const url = `${baseUrl}/game.html?game=${game.slug}`;
          if (!uniqueUrls.has(url)) {
            uniqueUrls.add(url);
            urlsArray.push({
              loc: url,
              lastmod: new Date().toISOString(),
              priority: "0.8"
            });
          }
        });

        // Sort URLs by priority (descending) then alphabetically
        urlsArray.sort((a, b) => {
          const priorityDiff = parseFloat(b.priority) - parseFloat(a.priority);
          if (priorityDiff !== 0) return priorityDiff;
          return a.loc.localeCompare(b.loc);
        });

        // Generate XML
        const urlsXml = urlsArray.map(urlObj => `
  <url>
    <loc>${urlObj.loc}</loc>
    <lastmod>${urlObj.lastmod}</lastmod>
    <priority>${urlObj.priority}</priority>
  </url>`).join("");

        const sitemap = `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">${urlsXml}
</urlset>`;

        document.getElementById("output").textContent = sitemap;
        console.log(`Generated sitemap with ${urlsArray.length} unique URLs (${htmlPages.length} static pages + ${gamesDatabase.length} game pages)`);
        
      } catch (error) {
        console.error('Error generating sitemap:', error);
        document.getElementById("output").textContent = `Error generating sitemap: ${error.message}`;
      }
    }
  </script>
  <script src="account-system.js"></script>
</body>
</html>
